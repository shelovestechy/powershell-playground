name: Test PowerShell exercise

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run exercise tests
        shell: pwsh
        run: ./tests/Measure-SignInActivity.Tests.ps1
