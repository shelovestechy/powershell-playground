name: Test PowerShell exercises

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check PowerShell syntax
        shell: pwsh
        run: ./tests/Test-ScriptSyntax.ps1

      - name: Check relative Markdown links
        shell: pwsh
        run: ./tests/Test-MarkdownLinks.ps1

      - name: Run sign-in exercise tests
        shell: pwsh
        run: ./tests/Measure-SignInActivity.Tests.ps1
